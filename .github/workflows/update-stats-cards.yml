# GitHub 언어 카드(SVG)를 만들어 profile/ 폴더에 커밋하는 워크플로
# - STATS_TOKEN 시크릿(본인 PAT)이 있으면 private 레포까지 집계하고, 없으면 공개 레포만 집계한다.
# - 카드에는 언어 비율만 표시되고, 레포 이름은 표시되지 않는다.
name: Update stats cards

on:
  # 매일 한국 시간 00:17에 실행 (cron은 UTC 기준)
  schedule:
    - cron: "17 15 * * *"
  # Actions 탭에서 수동 실행
  workflow_dispatch:
  # 이 워크플로 파일이 main에 반영되면 바로 한 번 실행
  push:
    branches: [main]
    paths:
      - .github/workflows/update-stats-cards.yml

permissions:
  contents: write

# 실행이 겹쳐 푸시가 충돌하지 않도록 한 번에 하나씩만 실행
concurrency:
  group: update-stats-cards
  cancel-in-progress: false

jobs:
  update-stats-cards:
    runs-on: ubuntu-latest
    env:
      # if 조건에서는 secrets를 직접 쓸 수 없어서, 시크릿이 있는지 여부만 env로 옮긴다
      HAS_STATS_TOKEN: ${{ secrets.STATS_TOKEN != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CASE: STATS_TOKEN 시크릿이 없을 때만 실행 → 공개 레포만 집계된다는 경고를 남긴다
      - name: Warn when STATS_TOKEN is missing
        if: env.HAS_STATS_TOKEN != 'true'
        run: echo "::warning::STATS_TOKEN 시크릿이 없어 공개 레포만 집계합니다."

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          # hide: 목록에서 숨길 언어 (숨긴 언어를 빼고 나머지끼리 비율을 다시 계산함)
          # card_width: 기본 300px에서는 긴 언어 이름(예: Visual Basic 6.0)의 비율이 잘려서 350px로 넓힘
          options: username=kyeong-ha&theme=dracula&exclude_repo=clone-web-scrapper,clone-zoom&hide=Procfile,HTML&layout=compact&langs_count=8&card_width=350
          path: profile/top-langs.svg
          # 비어 있으면 Action이 기본 GITHUB_TOKEN(공개 레포만)으로 대신 조회한다
          token: ${{ secrets.STATS_TOKEN }}
          # 실행할 때마다 최신 2.x를 새로 받지 않도록 코어 버전을 고정
          core_version: 2.2.0
          # 조회에 실패하면 에러 카드로 덮어쓰지 않고 실행을 실패 처리
          fail_on_error: true

      - name: Commit and push changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg

          # CASE 1: 카드 내용이 이전과 같으면 커밋하지 않고 종료
          if git diff --cached --quiet; then
            echo "카드 변경 없음 - 커밋을 건너뜁니다."
            exit 0
          fi

          # CASE 2: 카드 내용이 바뀌었으면 커밋하고 main에 푸시
          git commit -m "Update stats cards"
          git push
